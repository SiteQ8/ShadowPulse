name: CI
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x shadowpulse.sh || true
      - name: Syntax check
        run: bash -n shadowpulse.sh && echo "Syntax OK"
      - name: Version check
        run: bash shadowpulse.sh --version
